<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="ui-sans-serif, system-ui, sans-serif">
  <style>
    .frame { fill: #ffffff; stroke: #374151; stroke-width: 2; }
    .box { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .boxDash { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .chip { fill: #fff; stroke: #9ca3af; stroke-width: 1.2; }
    .chipActive { fill: #111827; stroke: #111827; }
    .accent { fill: #111827; stroke: #111827; }
    .label { fill: #111827; font-size: 14px; }
    .tag { fill: #6b7280; font-size: 11px; }
    .ttl { fill: #111827; font-size: 22px; font-weight: 700; }
    .badge { fill: #fef3c7; stroke: #f59e0b; }
  </style>

  <rect class="frame" x="1" y="1" width="1198" height="798" />

  <!-- Header -->
  <rect class="box" x="0" y="0" width="1200" height="60" />
  <rect class="accent" x="40" y="20" width="18" height="18" rx="3" />
  <text class="label" x="70" y="35" font-weight="700">Tool Hub</text>
  <rect x="948" y="18" width="72" height="24" rx="3" fill="#111827" />
  <text class="label" x="984" y="35" text-anchor="middle" style="fill:#fff">카탈로그</text>
  <text class="label" x="1060" y="35">요청하기</text>

  <!-- Title -->
  <text class="ttl" x="40" y="110">카탈로그</text>
  <text class="tag" x="128" y="110">생성된 모든 프로토타입 (23)</text>

  <!-- Search + controls -->
  <rect class="box" x="40" y="135" width="700" height="46" rx="6" />
  <text class="tag" x="60" y="163">🔍  도구명, 태그, 설명으로 검색</text>
  <rect class="box" x="760" y="135" width="180" height="46" rx="6" />
  <text class="label" x="850" y="163" text-anchor="middle">최신순 ▼</text>
  <rect class="accent" x="960" y="135" width="200" height="46" rx="6" />
  <text class="label" x="1060" y="163" text-anchor="middle" style="fill:#fff">+ 새 도구 요청</text>

  <!-- Tag chips -->
  <g>
    <rect class="chipActive" x="40" y="200" width="60" height="28" rx="14" />
    <text class="tag" x="70" y="218" text-anchor="middle" style="fill:#fff">전체</text>
    <rect class="chip" x="112" y="200" width="72" height="28" rx="14" />
    <text class="tag" x="148" y="218" text-anchor="middle">기획</text>
    <rect class="chip" x="196" y="200" width="84" height="28" rx="14" />
    <text class="tag" x="238" y="218" text-anchor="middle">마케팅</text>
    <rect class="chip" x="292" y="200" width="72" height="28" rx="14" />
    <text class="tag" x="328" y="218" text-anchor="middle">운영</text>
    <rect class="chip" x="376" y="200" width="72" height="28" rx="14" />
    <text class="tag" x="412" y="218" text-anchor="middle">포맷</text>
    <rect class="chip" x="460" y="200" width="80" height="28" rx="14" />
    <text class="tag" x="500" y="218" text-anchor="middle">계산기</text>
  </g>

  <!-- Grid 3x2 cards (6) -->
  <g font-size="14">
    <!-- Card 1 with promotion badge -->
    <rect class="box" x="40" y="260" width="360" height="160" rx="6" />
    <rect class="badge" x="56" y="276" width="80" height="22" rx="3" />
    <text class="tag" x="66" y="291" fill="#b45309">승격 후보</text>
    <text class="label" x="56" y="330" font-weight="700">ROAS 계산기</text>
    <text class="tag" x="56" y="352">광고비/매출 입력 → ROAS % + 순이익 + 흑자/적자 판정</text>
    <text class="tag" x="56" y="395">👤 요청: @jaemin  ·  ▶ 사용 12회  ·  ⭐ 3</text>

    <!-- Card 2 -->
    <rect class="box" x="420" y="260" width="360" height="160" rx="6" />
    <text class="label" x="436" y="300" font-weight="700">JSON 포매터</text>
    <text class="tag" x="436" y="322">1줄 JSON → 2-space 들여쓰기 + 에러 행·열 표시</text>
    <text class="tag" x="436" y="395">👤 요청: @soyeon  ·  ▶ 사용 8회  ·  ⭐ 2</text>

    <!-- Card 3 -->
    <rect class="box" x="800" y="260" width="360" height="160" rx="6" />
    <text class="label" x="816" y="300" font-weight="700">HEX 색상 변환기</text>
    <text class="tag" x="816" y="322">#RRGGBB → RGB/HSL/반대색 + 실제 색상 샘플</text>
    <text class="tag" x="816" y="395">👤 요청: @taejun  ·  ▶ 사용 5회  ·  ⭐ 1</text>

    <!-- Card 4 -->
    <rect class="box" x="40" y="440" width="360" height="160" rx="6" />
    <text class="label" x="56" y="480" font-weight="700">(프로토타입)</text>
    <text class="tag" x="56" y="502">요청이 쌓이며 자동으로 카드 추가</text>
    <text class="tag" x="56" y="575">👤 요청: @...  ·  ▶ 사용 N회</text>

    <!-- Card 5 -->
    <rect class="box" x="420" y="440" width="360" height="160" rx="6" />
    <text class="label" x="436" y="480" font-weight="700">(프로토타입)</text>

    <!-- Card 6 -->
    <rect class="box" x="800" y="440" width="360" height="160" rx="6" />
    <text class="label" x="816" y="480" font-weight="700">(프로토타입)</text>
  </g>

  <!-- Empty state hint (pseudo) -->
  <rect class="boxDash" x="40" y="625" width="1120" height="100" rx="6" />
  <text class="tag" x="600" y="665" text-anchor="middle">빈 상태: 검색 결과 없음 시 "검색어를 바꾸거나 직접 요청하기" CTA</text>
  <text class="tag" x="600" y="690" text-anchor="middle">전체 빈 상태: "첫 번째 도구 요청" 유도 버튼</text>

  <!-- Footer -->
  <line x1="0" y1="790" x2="1200" y2="790" stroke="#e5e7eb" />
  <text class="tag" x="40" y="790">02 · Catalog (/catalog)</text>
  <text class="tag" x="1160" y="790" text-anchor="end">Wireframe — 저화질 레이아웃</text>
</svg>
