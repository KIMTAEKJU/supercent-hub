<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="ui-sans-serif, system-ui, sans-serif">
  <style>
    .frame { fill: #ffffff; stroke: #374151; stroke-width: 2; }
    .box { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1.5; }
    .input { fill: #ffffff; stroke: #9ca3af; stroke-width: 1.5; }
    .boxDash { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .accent { fill: #111827; stroke: #111827; }
    .accentBtn { fill: #f59e0b; stroke: #b45309; stroke-width: 1.5; }
    .label { fill: #111827; font-size: 14px; }
    .tag { fill: #6b7280; font-size: 11px; }
    .ttl { fill: #111827; font-size: 22px; font-weight: 700; }
    .req { fill: #b91c1c; font-size: 14px; font-weight: 700; }
  </style>

  <rect class="frame" x="1" y="1" width="1198" height="798" />

  <!-- Header -->
  <rect class="box" x="0" y="0" width="1200" height="60" />
  <rect class="accent" x="40" y="20" width="18" height="18" rx="3" />
  <text class="label" x="70" y="35" font-weight="700">Tool Hub</text>
  <text class="label" x="950" y="35">카탈로그</text>
  <rect x="1020" y="18" width="80" height="24" rx="3" fill="#111827" />
  <text class="label" x="1060" y="35" text-anchor="middle" fill="#fff">요청하기</text>

  <!-- Breadcrumb -->
  <text class="tag" x="40" y="90">홈 / 도구 요청하기</text>

  <!-- Title -->
  <text class="ttl" x="40" y="125">도구 요청하기</text>
  <text class="tag" x="40" y="148">4개 필드를 모두 채워주세요. 평균 2분 소요.</text>

  <!-- Card -->
  <rect class="box" x="40" y="170" width="830" height="580" rx="8" />

  <!-- Field 1: Problem -->
  <text class="label" x="68" y="205" font-weight="600">문제</text>
  <text class="req" x="108" y="205">*</text>
  <text class="tag" x="68" y="222">어떤 일이 불편한가요? (1-2문장)</text>
  <rect class="input" x="68" y="235" width="774" height="76" rx="4" />
  <text class="tag" x="84" y="260">예) 매일 ROAS를 엑셀로 계산하는데 공식을 까먹어서 검색한다</text>

  <!-- Field 2: Current way -->
  <text class="label" x="68" y="345" font-weight="600">현재 방식</text>
  <text class="req" x="148" y="345">*</text>
  <text class="tag" x="68" y="362">지금은 어떻게 처리하나요?</text>
  <rect class="input" x="68" y="375" width="774" height="76" rx="4" />
  <text class="tag" x="84" y="400">예) 구글에서 공식 검색 → 엑셀에 복붙 → 수동 계산</text>

  <!-- Field 3: Expected outcome -->
  <text class="label" x="68" y="485" font-weight="600">기대 결과</text>
  <text class="req" x="148" y="485">*</text>
  <text class="tag" x="68" y="502">도구가 무엇을 해주기를 원하시나요?</text>
  <rect class="input" x="68" y="515" width="774" height="76" rx="4" />
  <text class="tag" x="84" y="540">예) 광고비와 매출을 입력하면 ROAS %, 흑자/적자를 즉시 보여줘</text>

  <!-- Field 4: Examples -->
  <text class="label" x="68" y="625" font-weight="600">예시/샘플 데이터</text>
  <text class="req" x="208" y="625">*</text>
  <text class="tag" x="68" y="642">입출력 예시 1-2개</text>
  <rect class="input" x="68" y="655" width="774" height="60" rx="4" />

  <!-- Submit button -->
  <rect class="accentBtn" x="690" y="760" width="180" height="46" rx="6" opacity="0" />
  <rect class="accentBtn" x="660" y="722" width="210" height="50" rx="6" />
  <text class="label" x="765" y="754" text-anchor="middle" fill="#fff" font-weight="700">요청 제출 →</text>

  <!-- Side info -->
  <rect class="boxDash" x="895" y="170" width="265" height="220" rx="8" />
  <text class="label" x="915" y="200" font-weight="700">처리 흐름</text>
  <text class="tag" x="915" y="230">1. 요청 해석</text>
  <text class="tag" x="915" y="252">2. 코드 생성</text>
  <text class="tag" x="915" y="274">3. Git 커밋</text>
  <text class="tag" x="915" y="296">4. Vercel 배포</text>
  <text class="tag" x="915" y="318">5. 카탈로그 등록</text>
  <text class="tag" x="915" y="355">평균 소요: 1-2분</text>
  <text class="tag" x="915" y="372">실패 시 자동 재시도 X</text>

  <rect class="boxDash" x="895" y="405" width="265" height="345" rx="8" />
  <text class="label" x="915" y="435" font-weight="700">주의사항</text>
  <text class="tag" x="915" y="465">· 생성 도구는 단일 페이지</text>
  <text class="tag" x="915" y="485">· 외부 API 호출 불가</text>
  <text class="tag" x="915" y="505">· 로그인·DB 불가</text>
  <text class="tag" x="915" y="525">· 순수 로직만 (계산/포맷/변환)</text>
  <text class="tag" x="915" y="555" font-weight="600">적합한 예시</text>
  <text class="tag" x="915" y="575">○ JSON/CSV 포매터</text>
  <text class="tag" x="915" y="595">○ 단위 변환기</text>
  <text class="tag" x="915" y="615">○ 요율·지표 계산기</text>
  <text class="tag" x="915" y="645" font-weight="600" fill="#b91c1c">부적합</text>
  <text class="tag" x="915" y="665">× "경쟁사 데이터 크롤링"</text>
  <text class="tag" x="915" y="685">× "GPT 호출해서 요약"</text>

  <!-- Footer -->
  <line x1="0" y1="790" x2="1200" y2="790" stroke="#e5e7eb" />
  <text class="tag" x="40" y="790">03 · Request Form (/request)</text>
  <text class="tag" x="1160" y="790" text-anchor="end">Wireframe — 저화질 레이아웃</text>
</svg>
